<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="/static/css/main.css">

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>
