[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-meta-injector"
version = "0.0.2"
description = "Inspect and edit media metadata with staged writes, edit-risk previews and integrity verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Apex Meta-Injector Team"}
]
keywords = ["metadata", "video", "audio", "ProRes", "DNxHD", "MXF", "MP4", "MOV", "XMP", "IPTC", "EXIF"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "mutagen>=1.47.0",
    "xxhash>=3.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pywebview>=5.0; sys_platform == 'win32'",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "build>=1.2.0",
]
ui-test = ["playwright>=1.50"]
build = [
    "pyinstaller>=6.4.0",
]

[project.scripts]
apex-injector = "apex_injector.__main__:main"

[project.gui-scripts]
apex-injector-gui = "apex_injector.__main__:main_gui"

[tool.setuptools.packages.find]
include = ["apex_injector*"]

[tool.setuptools.package-data]
apex_injector = [
    "gui/static/**/*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
